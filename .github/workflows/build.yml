name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf automake libtool \
            pkg-config cmake build-essential libffi-dev libssl-dev zlib1g-dev libncurses5-dev \
            libsqlite3-dev libreadline-dev liblzma-dev

      - name: Install buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer cython

      - name: Patch system python cgi module
        run: sudo /usr/bin/python3 -m pip install legacy-cgi --break-system-packages

      - name: Create pip constraints (fix cgi module bug)
        run: echo "Cython>=3.0.10" > /tmp/constraints.txt

      - name: Build APK
        env:
          PIP_CONSTRAINT: /tmp/constraints.txt
        run: |
          yes | buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: myapp-apk
          path: bin/*.apk
