      - name: Force system python3 to use 3.11
        run: |
          sudo ln -sf "$pythonLocation/bin/python3" /usr/bin/python3
          sudo ln -sf "$pythonLocation/bin/python3" /usr/bin/python
          sudo ln -sf "$pythonLocation/bin/pip3" /usr/bin/pip3
          which python3 && python3 --version

name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf automake libtool \
            pkg-config cmake build-essential libffi-dev libssl-dev zlib1g-dev libncurses5-dev \
            libsqlite3-dev libreadline-dev liblzma-dev

      - name: Install buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer cython

      - name: Force system python3 to use 3.11
        run: |
          sudo ln -sf "$pythonLocation/bin/python3" /usr/bin/python3
          sudo ln -sf "$pythonLocation/bin/python3" /usr/bin/python
          sudo ln -sf "$pythonLocation/bin/pip3" /usr/bin/pip3
          which python3 && python3 --version

      - name: Build APK
        run: |
          yes | buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: myapp-apk
          path: bin/*.apk
